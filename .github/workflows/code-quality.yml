name: Code quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  HUSKY: 0

jobs:
  checks:
    name: Format, lint, types, tests, specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for turbo --affected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack (Yarn version from packageManager)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies (lockfile must be up to date)
        run: yarn install --immutable

      - name: Check lockfile has no duplicate ranges
        run: yarn dedupe --check

      # Pull requests: only workspaces affected by changes against the base branch.
      # Turbo reads the base from GITHUB_BASE_REF automatically.
      - name: Affected checks
        if: github.event_name == 'pull_request'
        run: yarn check:affected

      # main and manual runs: everything, so nothing slips through a stale base.
      - name: Full checks
        if: github.event_name != 'pull_request'
        run: yarn check
