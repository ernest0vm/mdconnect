# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  auto_approvals:
    # Request changes for blocking findings; approve once required threads are resolved,
    # the latest commit is reviewed and pre-merge checks pass.
    enabled: true

  # Do not review files we must not hand-edit: an unresolvable comment there would
  # withhold the automatic approval.
  path_filters:
    - '!yarn.lock'
    # NetMD replies recorded from real devices (data, not code).
    - '!packages/netmd/src/fixtures/**'
    # The committed Yarn release (yarnPath), a third-party build.
    - '!.yarn/releases/**'
    - '!LICENSE'
    # Generated by `openspec init` / `openspec update`.
    - '!.claude/commands/opsx/**'
    - '!.claude/skills/openspec-*/**'
    # Vendored verbatim from upstream (see SOURCE.md).
    - '!.claude/skills/typescript-clean-code/**'
