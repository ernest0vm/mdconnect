# Electron, Vite and native tooling expect a node_modules tree; PnP is not used.
nodeLinker: node-modules

# Supply-chain hardening: refuse any package version published less than 7 days ago.
# To bypass for a specific, reviewed package add it to npmPreapprovedPackages.
npmMinimalAgeGate: '7d'

# Dependency lifecycle scripts are disabled by default (Yarn default, made explicit).
# Opt individual packages in via `dependenciesMeta.<pkg>.built: true` in package.json.
enableScripts: false

# The Yarn release is committed so every environment runs the same Yarn without Corepack
# (Vercel's Corepack support is experimental). Update with `yarn set version <x.y.z> --yarn-path`,
# then restore these comments, which that command strips.
yarnPath: .yarn/releases/yarn-4.14.1.cjs
